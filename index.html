<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Amaliyot-1</title>
    <link rel="stylesheet" href="/src/css/index.css" />
    <link rel="shortcut icon" href="/src/images/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style type="text/tailwindcss">
      @theme {
        --font-google: "Google Sans", sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="flex items-center justify-between mt-3">
          <a href="index.html">
            <img src="src/images/logo.png" alt="logo" class="w-10" />
          </a>

          <nav>
            <ul class="hidden md:flex gap-5">
              <li>
                <a href="#" data-key="about" class="font-google capitalize"></a>
              </li>
              <li>
                <a
                  href="#"
                  data-key="collections"
                  class="font-google capitalize"
                ></a>
              </li>
              <li>
                <a
                  href="#"
                  data-key="projects"
                  class="font-google capitalize"
                ></a>
              </li>
              <li>
                <a
                  href="#"
                  data-key="campaigns"
                  class="font-google capitalize"
                ></a>
              </li>
              <li>
                <a href="#" data-key="blog" class="font-google capitalize"></a>
              </li>
            </ul>
          </nav>

          <div class="flex items-center gap-3">
            <a
              href="#"
              class="flex items-center md:bg-black bg-white rounded-lg px-3 py-3 cursor-pointer gap-3 active:bg-gray-300"
            >
              <i
                data-lucide="shopping-cart"
                class="md:text-white text-black inline-block size-5"
              ></i>
              <p
                class="font-google text-white capitalize hidden md:block"
                data-key="your_card"
              ></p>
            </a>
            <button class="md:hidden active:bg-gray-300 md:active:bg-none burger-button">
              <i data-lucide="menu"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div
      class="burger-menu-mask w-dvw h-dvh fixed top-0 left-0 bg-black/30"
    ></div>
    <div
      class="burger-menu bg-white w-dvw h-dvh fixed top-0 left-0 max-w-70 z-999"
    >
      <div class="flex items-center justify-between">
        <div>
          <a href="!#">
            <img src="/src/images/logo.png" alt="logo" class="w-10" />
          </a>
        </div>
        <div>
          <button class="inline-block px-2 py-2 close-button">
            <i data-lucide="x" class="cursor-pointer active:bg-gray-300"></i>
          </button>
        </div>
      </div>
    </div>
    <main></main>
    <footer></footer>

    <!-- Development version -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Production version -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/src/js/icons.js"></script>
    <script src="/src/js/app.js"></script>
    <script src="/src/js/translate.js" type="module" defer></script>
    <script src="/src/js/translations.js"></script>
  </body>
</html>
